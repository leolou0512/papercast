<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Papers</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/social.css">
<link rel="stylesheet" href="/tour.css">
<script src="/theme.js"></script>
<script src="/avatar.js" defer></script>
<script src="/social.js" defer></script>
<script src="/tour.js" defer></script>
<script src="/app.js" defer></script>
</head>
<body>
<div class="app">
  <aside class="list-pane" id="list-pane">
    <div class="offline" id="offline" hidden></div>
    <header class="list-head">
      <h1>Papers</h1>
      <div class="head-btns">
        <button type="button" class="icon-btn help-btn" id="help-btn" aria-label="Help" title="Help" aria-haspopup="dialog" aria-expanded="false">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7.8"/><path d="M7.8 7.9a2.3 2.3 0 1 1 3.3 2.1c-.7.3-1.1.8-1.1 1.5v.2"/><circle cx="10" cy="14.1" r=".5" fill="currentColor"/></svg>
        </button>
        <button type="button" class="icon-btn" id="map-btn" aria-label="Paper map" title="Paper map">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6.4 6.9 8.7 12.4M13.6 6.2 11.3 12.2M7.4 5.2h5.2"/><circle cx="5.4" cy="5.2" r="2"/><circle cx="14.6" cy="4.6" r="2"/><circle cx="10" cy="14.6" r="2.4"/></svg>
        </button>
        <button type="button" class="icon-btn" id="set-btn" aria-label="Settings" title="Settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>
    <div class="search">
      <div class="s-box">
        <svg class="s-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="m11 11 3.5 3.5" stroke-linecap="round"/></svg>
        <input class="s-in" type="search" id="search" placeholder="Search papers, topics, people" aria-label="Search papers" aria-keyshortcuts="/" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <button type="button" class="s-clear" id="search-clear" aria-label="Clear the search" hidden></button>
      </div>
      <button type="button" class="icon-btn filter-btn" id="filter-btn" aria-label="Filters" aria-expanded="false" aria-controls="fpanel"></button>
      <button type="button" class="icon-btn sort-btn" id="sort-btn" aria-label="Sort" aria-haspopup="menu" aria-expanded="false"></button>
    </div>
    <div class="fpanel" id="fpanel" hidden></div>
    <div class="filter" id="filter" hidden><div class="chips" id="chips"></div><button type="button" class="text-btn" id="filter-clear">Clear</button></div>
    <div class="sstat" id="sstat" role="status" hidden></div>
    <ul class="rows" id="rows"></ul>
    <div class="rows-end" id="rows-end" aria-hidden="true"></div>
  </aside>

  <main class="window" id="win">
    <div class="nothing" id="nothing"><div><div class="big">Nothing open</div><div>Pick a paper.</div></div></div>
    <div class="paper" id="paper" hidden>
      <div class="phone-top">
        <button type="button" class="icon-btn" id="back" aria-label="Back to papers"></button>
        <button type="button" class="icon-btn" id="w-more-phone" aria-label="More"></button>
      </div>
      <div class="p-mid" id="p-mid">
        <section class="pz" id="pz"><div class="col">
          <div class="pz-head">
            <div class="grow">
              <h2 id="w-title"></h2>
              <p class="byline" id="w-by"></p>
            </div>
            <button type="button" class="w-play" id="w-play" aria-label="Play" hidden></button>
            <button type="button" class="icon-btn" id="w-more" aria-label="More"></button>
          </div>
          <div class="pz-who"><p class="maker" id="w-maker"></p></div>
          <p class="details" id="w-details" hidden></p>
          <div class="w-tags" id="w-tags" hidden></div>
          <div class="pz-acts">
            <button type="button" class="lbox" id="w-listened" role="checkbox" aria-checked="false" hidden><span class="box" aria-hidden="true"></span><span>Listened</span></button>
            <button type="button" class="explain" id="x-open" disabled><span class="x-icon" id="x-icon"></span><span>Explainer</span></button>
          </div>
          <div class="pz-state" id="w-state" hidden></div>
        </div></section>
        <section class="versions" id="versions" hidden><div class="col">
          <h3 class="sec-h">Versions</h3>
          <div class="vlist" id="vlist" role="radiogroup" aria-label="Versions"></div>
        </div></section>
        <div class="ptabs" id="ptabs" role="tablist" aria-label="Transcript and comments">
          <button type="button" class="tab" id="pt-tr" role="tab" aria-selected="true" aria-controls="tr">Transcript</button>
          <button type="button" class="tab" id="pt-c" role="tab" aria-selected="false" aria-controls="comments">Comments</button>
        </div>
        <section class="tr" id="tr" hidden><div class="col">
          <div class="tr-head">
            <h3 class="sec-h"><span class="tr-h">Transcript</span> <span class="tr-note" id="tr-note" hidden>· timing estimated</span></h3>
            <div class="tr-find">
              <input class="field" type="search" id="tr-q" placeholder="Find in transcript" aria-label="Find in transcript" autocomplete="off" enterkeyhint="search">
              <span class="tr-count t" id="tr-count" role="status"></span>
              <button type="button" class="icon-btn" id="tr-prev" aria-label="Previous match" disabled></button>
              <button type="button" class="icon-btn" id="tr-next" aria-label="Next match" disabled></button>
            </div>
          </div>
          <div class="tr-body" id="tr-body"></div>
          <div class="tr-now-wrap"><button type="button" class="tr-now" id="tr-now" hidden>Back to now</button></div>
        </div></section>
      </div>
    </div>
    <div class="settings" id="settings" hidden>
      <div class="phone-top">
        <button type="button" class="icon-btn" id="set-back" aria-label="Back to papers"></button>
      </div>
      <section class="pz set-head"><div class="col">
        <h2>Settings</h2>
        <p class="byline" id="set-who"></p>
        <div class="tabs" id="set-tabs" role="tablist" aria-label="Settings"></div>
      </div></section>
      <section class="set-body"><div class="col" id="set-body"></div></section>
    </div>
  </main>
</div>

<footer class="bar" id="bar" hidden>
  <div class="b-prog" id="b-prog" aria-hidden="true"></div>
  <div class="b-now">
    <button type="button" class="b-open" id="bar-open"><span class="b-title" id="bar-title"></span><span class="b-sub t" id="bar-sub"></span></button>
  </div>
  <div class="b-mid">
    <div class="b-ctl">
      <button type="button" class="skip" id="p-back" aria-label="Back 15 seconds"></button>
      <button type="button" class="play" id="p-play" aria-label="Play"></button>
      <button type="button" class="skip" id="p-fwd" aria-label="Forward 30 seconds"></button>
    </div>
    <div class="b-seek">
      <span class="b-time t" id="p-el">0:00</span>
      <div class="scrub" id="scrub" role="slider" tabindex="0" aria-label="Position" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
        <div class="track"></div><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div>
      </div>
      <span class="b-time t" id="p-rem">&minus;0:00</span>
    </div>
  </div>
  <div class="b-right">
    <button type="button" class="upnext" id="p-next" aria-haspopup="dialog" hidden><span class="un-l">Up next</span><span class="un-t" id="p-next-t"></span><span class="un-n t" id="p-next-n"></span></button>
    <button type="button" class="speed t" id="p-speed" aria-label="Playback speed">1&times;</button>
    <button type="button" class="icon-btn b-exp" id="bar-exp" aria-label="Player controls" aria-expanded="false"></button>
  </div>
</footer>
<audio id="audio" preload="metadata"></audio>
<div class="toast" id="toast" role="status" hidden><span class="msg-t" id="toast-msg"></span><button type="button" id="toast-act" hidden></button></div>
<div id="map" hidden></div>
<div class="scrim" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ov-label">
    <div class="sheet-h"><span id="ov-label">Explainer</span>
      <button type="button" class="icon-btn" id="x-close" aria-label="Close the explainer"></button></div>
    <iframe id="x-frame" class="x-frame" sandbox="allow-scripts allow-popups" referrerpolicy="no-referrer" title="Explainer"></iframe>
  </div>
</div>
<div class="scrim" id="q-overlay" hidden>
  <div class="sheet q-sheet" role="dialog" aria-modal="true" aria-labelledby="q-label">
    <div class="sheet-h q-h"><h2 class="q-title" id="q-label">Up next</h2>
      <button type="button" class="text-btn" id="q-clear">Clear</button>
      <button type="button" class="icon-btn" id="q-close" aria-label="Close Up next"></button></div>
    <p class="q-now" id="q-now" hidden></p>
    <ol class="q-list" id="q-list"></ol>
    <p class="q-empty" id="q-empty" hidden>Nothing up next. Play next and Add to Up next are in a paper’s ⋯ menu.</p>
  </div>
</div>
</body>
</html>
