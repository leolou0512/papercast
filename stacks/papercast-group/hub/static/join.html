<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Join papercast</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/auth.css">
<link rel="stylesheet" href="/themes.css">
<script src="/theme.js"></script>
<script src="/join.js" defer></script>
</head>
<body>
<main class="box">
  <h1 id="title">Join papercast</h1>
  <p class="msg" id="msg">Loading…</p>

  <form id="join" hidden>
    <label for="name">Your name, as the group will see it</label>
    <input class="field" id="name" autocomplete="name" maxlength="60" required enterkeyhint="next">
    <label for="email">Email (optional)</label>
    <input class="field" id="email" type="email" autocomplete="email" autocapitalize="off" spellcheck="false"
           maxlength="254" enterkeyhint="go">
    <div class="row"><button type="submit" class="btn-accent" id="join-go">Join</button></div>
  </form>

  <div id="signin" hidden>
    <div class="row"><button type="button" class="btn-accent" id="signin-go">Sign in</button></div>
  </div>
</main>
</body>
</html>
